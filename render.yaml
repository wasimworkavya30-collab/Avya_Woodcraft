services:
  - type: web
    name: avya-attendance
    runtime: node
    # Free plan: no card needed, but the SQLite file resets when the service
    # restarts or wakes from sleep. See DEPLOY.md to switch to a persistent disk.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_FILE
        value: data/avya.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@avyawoodcraft.in
      - key: ADMIN_PASSWORD
        sync: false
      # Set these to the workshop's real coordinates before testing on a phone.
      - key: WORKSHOP_LAT
        value: 17.3850
      - key: WORKSHOP_LNG
        value: 78.4867
      - key: GEOFENCE_METRES
        value: 150
      - key: SEED_DEMO
        value: true

# To keep employees, punches and paired phones between restarts:
#   1. change `plan: free` above to `plan: starter` (paid, ~$7/month)
#   2. add under startCommand:
#        disk:
#          name: avya-data
#          mountPath: /data
#          sizeGB: 1
#   3. change DATABASE_FILE to /data/avya.db
